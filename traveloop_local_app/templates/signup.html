{% extends "base.html" %}
{% block title %}Signup - Traveloop{% endblock %}
{% block content %}
<div class="auth-shell">
    <form class="auth-card" method="post" onsubmit="return validateSignup()">
        <h1>Create account</h1>
        <p>Start planning personalized trips.</p>
        <label>Name</label>
        <input type="text" name="name" placeholder="Your name" required>
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input id="password" type="password" name="password" placeholder="Minimum 6 characters" minlength="6" required>
        <label>Confirm Password</label>
        <input id="confirm_password" type="password" name="confirm_password" placeholder="Repeat password" minlength="6" required>
        <p id="signupError" class="form-error"></p>
        <button class="btn primary full" type="submit">Signup</button>
        <div class="auth-links"><a href="{{ url_for('login') }}">Already have an account?</a></div>
    </form>
</div>
{% endblock %}
