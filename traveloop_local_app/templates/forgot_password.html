{% extends "base.html" %}
{% block title %}Forgot Password - Traveloop{% endblock %}
{% block content %}
<div class="auth-shell">
    <form class="auth-card" method="post">
        <h1>Forgot Password</h1>
        <p>This local demo does not send email. Submit your email to show the reset flow.</p>
        <label>Email</label>
        <input type="email" name="email" placeholder="you@example.com" required>
        <button class="btn primary full" type="submit">Request Reset</button>
        <div class="auth-links"><a href="{{ url_for('login') }}">Back to login</a></div>
    </form>
</div>
{% endblock %}
